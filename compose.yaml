services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swf
      POSTGRES_PASSWORD: swf-local-only
      POSTGRES_DB: swf
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swf -d swf"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - swf-postgres:/var/lib/postgresql/data

volumes:
  swf-postgres:
